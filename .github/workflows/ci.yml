name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            laravel: "11"
            testbench: "^9.0"
          - php: "8.4"
            laravel: "11"
            testbench: "^9.0"
          - php: "8.3"
            laravel: "12"
            testbench: "^10.0"
          - php: "8.4"
            laravel: "12"
            testbench: "^10.0"
          - php: "8.3"
            laravel: "13"
            testbench: "^11.0"
          - php: "8.4"
            laravel: "13"
            testbench: "^11.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, xmlreader
          coverage: none

      - name: Pin testbench to Laravel ${{ matrix.laravel }}
        run: |
          composer require \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/database:^${{ matrix.laravel }}.0" \
            --no-interaction --no-update

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-stable

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests (Pest)
        run: vendor/bin/pest --no-coverage
