name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 11 is EOL and no longer tested: an advisory fixed only in
          # 12.71.0/13.40.0 (PKSA-yxbx-3c9s-cjt9) blocks every 11.x release.
          - php: "8.4"
            laravel: "12"
            testbench: "^10.0"
          - php: "8.5"
            laravel: "12"
            testbench: "^10.0"
          - php: "8.4"
            laravel: "13"
            testbench: "^11.0"
          - php: "8.5"
            laravel: "13"
            testbench: "^11.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, xmlreader
          tools: pie
          coverage: none

      # The prebuilt rusty_sheet binary from its GitHub release, for the 'rust' drivers.
      # Fails the job if it doesn't load, so the rust tests can't silently skip.
      - name: Install the rusty_sheet extension
        env:
          # PIE fetches the release asset via the GitHub API; without a token,
          # shared runner IPs get rate-limited ("Could not authenticate against github.com").
          GH_TOKEN: ${{ github.token }}
        run: |
          # PIE must write to the system extension/ini dirs; it can't prompt for sudo in CI,
          # so run it as root (passwordless on GitHub runners) and pin the setup-php binary.
          # sudo drops the environment, so pass the token through explicitly.
          sudo --preserve-env=GH_TOKEN "$(command -v pie)" install "mrdellimore/rusty-sheet:^0.1" \
            --with-php-config="$(command -v php-config)" --no-interaction
          php -r 'extension_loaded("rusty_sheet") || exit(1); echo "rusty_sheet ", phpversion("rusty_sheet"), PHP_EOL;'

      - name: Pin testbench to Laravel ${{ matrix.laravel }}
        run: |
          composer require \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/database:^${{ matrix.laravel }}.0" \
            --no-interaction --no-update

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-stable

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Rector (dry-run)
        run: vendor/bin/rector --dry-run

      - name: Run tests (Pest)
        run: vendor/bin/pest --no-coverage --exclude-group=benchmark

      - name: Run tests on the rust drivers (Pest)
        env:
          SHEET_STREAM_TEST_READER: rust
          SHEET_STREAM_TEST_WRITER: rust
        run: vendor/bin/pest --no-coverage --exclude-group=benchmark
