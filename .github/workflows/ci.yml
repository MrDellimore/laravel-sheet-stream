name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 11 is EOL and emits PHP 8.5 deprecations, so it stays on 8.4.
          # Its advisory situation is handled by the ignore step below.
          - php: "8.4"
            laravel: "11"
            testbench: "^9.0"
          - php: "8.4"
            laravel: "12"
            testbench: "^10.0"
          - php: "8.5"
            laravel: "12"
            testbench: "^10.0"
          - php: "8.4"
            laravel: "13"
            testbench: "^11.0"
          - php: "8.5"
            laravel: "13"
            testbench: "^11.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, xmlreader
          coverage: none

      - name: Pin testbench to Laravel ${{ matrix.laravel }}
        run: |
          composer require \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/database:^${{ matrix.laravel }}.0" \
            --no-interaction --no-update

      # Laravel 11's security window has closed, so the five advisories below
      # will never be fixed in 11.x and Composer refuses to install any 11.x
      # release. They are ignored for the Laravel 11 job ONLY -- the 12 and 13
      # jobs keep advisory blocking fully on, which matters because the
      # critical one (CVE-2026-114509) also covers Laravel 13 below 13.29.0.
      #
      # Advisories that WERE fixed inside 11.x are deliberately absent, so
      # Composer still refuses the 11.x releases carrying them and resolves to
      # the newest patched 11.x (>= 11.44.1 clears CVE-2025-27515 and
      # CVE-2024-52301). Review this list whenever a new advisory lands.
      - name: Ignore Laravel 11's unfixable advisories (Laravel 11 job only)
        if: matrix.laravel == '11'
        run: >
          composer config --json policy.advisories.ignore-id
          '["PKSA-b41t-wbzk-9q51","PKSA-d5tc-s1qs-h781","PKSA-m5cs-t1y6-qpcs","PKSA-3r5d-mb8f-1qw9","PKSA-mdq4-51ck-6kdq"]'

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-stable

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Rector (dry-run)
        run: vendor/bin/rector --dry-run

      - name: Run tests (Pest)
        run: vendor/bin/pest --no-coverage --exclude-group=benchmark
